<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List — DOM Exercise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs doing?" autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <ul id="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
