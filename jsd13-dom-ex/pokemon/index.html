<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Pokemon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- กล่องค้นหาโปเกมอนด้านบน -->
    <div class="search-panel">
        <h1>Search Pokemon!</h1>

        <input type="text" id="input-pokemon" placeholder="Enter Pokemon...">

        <div class="btn-row">
            <button id="btn-find">Find Pokemon</button>
            <button id="btn-random">Random</button>
            <button id="btn-reset">Reset</button>
        </div>
    </div>

    <!-- พื้นที่แสดงการ์ด 3D Coverflow -->
    <div id="pokedex"></div>

    <script src="emoji-burst.js"></script>
    <script src="coverflow.js"></script>
    <script src="script.js"></script>
</body>
</html>
