<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Pokemon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- หน้า Intro Vortex เเสดงการ์ดโปเกมอนวนก้นหอย ก่อนเข้าสู่หน้าหลัก -->
    <div id="intro-screen" class="intro-screen">
        <div id="spiral-container" class="spiral-container"></div>
        <div class="intro-overlay">
            <div class="intro-badge">★ POKEMON ARCHIVE ★</div>
            <h1 class="intro-title">POKEDEX 3D</h1>
            <p class="intro-subtitle">DISCOVER & CATCH 'EM ALL</p>
            <div class="intro-cta">
                <span class="intro-press-text">▶ CLICK ANYWHERE TO START ◀</span>
            </div>
        </div>
    </div>

    <div class="search-panel">
        <h1>Search Pokemon!</h1>

        <input type="text" id="input-pokemon" placeholder="Enter Pokemon...">

        <div class="btn-row">
            <button id="btn-find">Find Pokemon</button>
            <button id="btn-random">Random</button>
            <button id="btn-reset">Reset</button>
        </div>
    </div>

    <div id="pokedex"></div>

    <script src="emoji-burst.js"></script>
    <script src="round-carousel.js"></script>
    <script src="spiral.js"></script>
    <script src="script.js"></script>
</body>
</html>
