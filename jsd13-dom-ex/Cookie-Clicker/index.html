<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker Game 🍪</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-container">
    
    <header class="header">
      <h1>🍪 Cookie Clicker</h1>
      <div class="stats">
        <p>จำนวนคุกกี้: <output id="score">0</output> ชิ้น</p>
        <p class="cps-text">ผลิตอัตโนมัติ: <output id="cps">0</output> ชิ้น/วินาที</p>
      </div>

      <!-- 8-Bit Retro XP Bar Component -->
      <div class="xp-section-8bit" aria-label="แถบค่าประสบการณ์ 8-Bit">
        <div class="xp-header-8bit">
          <span class="level-badge-8bit">LV.<output id="level-num">1</output></span>
          <span class="xp-label-8bit">XP <output id="xp-percent">0%</output></span>
        </div>
        <div class="xp-bar-8bit-frame">
          <div id="xp-bar-fill" class="xp-bar-8bit-fill" style="width: 0%;"></div>
          <div id="level-up-banner" class="level-up-flash-8bit hidden">⭐ LEVEL UP! ⭐</div>
        </div>
        <div class="xp-sub-8bit">
          <span id="xp-current">0</span> / <span id="xp-max">100</span> XP
        </div>
      </div>
    </header>

    <section class="cookie-section" aria-label="พื้นที่คลิกคุกกี้">
      <button id="cookie-btn" class="cookie-btn" aria-label="คลิกเพื่อเก็บคุกกี้">
        🍪
      </button>
      <p class="click-info">คลิกที่คุกกี้เพื่อเริ่มอบ!</p>
    </section>

    <aside class="shop-section" aria-label="ร้านค้าอัปเกรด">
      <h2>🛒 ร้านค้าอัปเกรด</h2>
      
      <ul class="upgrade-list">
        <li>
          <button id="upgrade-click" class="upgrade-btn" disabled>
            <div class="upgrade-info">
              <strong>👆 นิ้วทองคำ (Click Power)</strong>
              <span>+1 คุกกี้ต่อการคลิก</span>
            </div>
            <div class="upgrade-cost">
              ราคา: <output id="cost-click">10</output> 🍪
            </div>
          </button>
        </li>

        <li>
          <button id="upgrade-auto" class="upgrade-btn" disabled>
            <div class="upgrade-info">
              <strong>👵 คุณยายช่วยอบ (Auto Clicker)</strong>
              <span>+1 คุกกี้ทุกๆ 1 วินาที</span>
            </div>
            <div class="upgrade-cost">
              ราคา: <output id="cost-auto">50</output> 🍪
            </div>
          </button>
        </li>
      </ul>
    </aside>

  </main>

  <script src="script.js"></script>
</body>
</html>
